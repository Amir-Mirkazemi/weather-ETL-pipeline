name: Hourly Weather ETL

on:
  workflow_dispatch: # manual runs for testing
  schedule:
    - cron: '0 * * * *' # top of every hour (GitHub may delay or skip scheduled runs under load)

concurrency:
  group: weather-etl
  cancel-in-progress: false # never overlap two runs that push to main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Run ETL script
        run: python main.py

      - name: Commit and push changes
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add weather_data.db
          git commit -m "Automated update: Weather Data" || exit 0
          git pull --rebase origin main
          git push
